<!DOCTYPE html>
<html lang="en">
<head>gi
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting</title>
</head>
<body>

    <!-- Bold text -->
    <p><b>This text is bold.</b></p>

    <!-- Important text (usually displayed in bold) -->
    <p><strong>This is important text.</strong></p>

    <!-- Italic text -->
    <p><i>This text is italic.</i></p>

    <!-- Emphasized text (usually displayed in italic) -->
    <p><em>This text is emphasized.</em></p>

    <!-- Underlined text -->
    <p><u>This text is underlined.</u></p>

    <!-- Highlighted text -->
    <p><mark>This text is highlighted.</mark></p>

    <!-- Smaller text -->
    <p><small>This is smaller text.</small></p>

    <!-- Deleted text (strikethrough) -->
    <p><del>This text is deleted.</del></p>

    <!-- Inserted text (usually underlined) -->
    <p><ins>This text is inserted.</ins></p>

    <!-- Subscript text -->
    <p>H<sub>2</sub>O</p>

    <!-- Superscript text -->
    <p>10<sup>2</sup> = 100</p>

</body>
</html>
