<!DOCTYPE html>
<!-- Declares that this document uses HTML5 -->

<html lang="en">
<!-- Root element of the HTML document. lang="en" specifies English as the page language -->

<head>
    <!-- Head contains information about the webpage (metadata) -->

    <meta charset="UTF-8">
    <!-- Supports almost all characters and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage responsive on mobile, tablet, and desktop -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Helps maintain compatibility with modern versions of Internet Explorer -->

    <title>My First Webpage</title>
    <!-- Defines the title displayed in the browser tab -->

</head>

<body>
    <!-- Body contains all the visible content of the webpage -->

    <h1>Hello World!</h1>
    <!-- Main heading of the webpage -->

    <p>Welcome to HTML and CSS Learning.</p>
    <!-- Paragraph element -->

</body>

</html>
<!-- Closing tag of the root HTML element -->
