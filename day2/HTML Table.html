<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>

    <h1>Student Information</h1>

    <!-- Creates an HTML table -->
    <table border="1">

        <!-- Table heading row -->
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <!-- First student record -->
        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>Python</td>
            <td>85</td>
        </tr>

        <!-- Second student record -->
        <tr>
            <td>102</td>
            <td>Aman</td>
            <td>Java</td>
            <td>90</td>
        </tr>

        <!-- Third student record -->
        <tr>
            <td>103</td>
            <td>Priya</td>
            <td>Web Development</td>
            <td>95</td>
        </tr>

    </table>

</body>
</html>
