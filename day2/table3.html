```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Table Concepts</title>
</head>
<body>

    <h1>Student Examination Result</h1>

    <table border="1">

        <caption>Annual Examination 2026</caption>

        <!-- Grouping columns -->
        <colgroup>
            <col>
            <col>
            <col span="2">
        </colgroup>

        <!-- Table Heading -->
        <thead>
            <tr>
                <th scope="col">Roll No.</th>
                <th scope="col">Student Name</th>
                <th scope="col">HTML Marks</th>
                <th scope="col">Python Marks</th>
            </tr>
        </thead>

        <!-- Table Data -->
        <tbody>
            <tr>
                <th scope="row">101</th>
                <td>Rahul</td>
                <td>85</td>
                <td>90</td>
            </tr>

            <tr>
                <th scope="row">102</th>
                <td>Priya</td>
                <td>95</td>
                <td>92</td>
            </tr>

            <tr>
                <th scope="row">103</th>
                <td>Aman</td>
                <td>78</td>
                <td>88</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <th colspan="2">Total Students</th>
                <td colspan="2">3</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
