```html
<!DOCTYPE html>
<html>
<head>
    <title>DIV vs SPAN</title>
</head>
<body>

    <h2>1. DIV Example</h2>

    <!-- DIV takes the full available width -->
    <div style="background-color: lightblue;">
        This is First box
    </div>
    <br><br>

    <div style="background-color: lightgreen;">
        This is Second box
    </div>

    <h2>2. SPAN Example</h2>

    <!-- SPAN takes only the space required by its content -->
    <span style="background-color: lightblue;">Rohit</span>

    <span style="background-color: lightgreen;">karan</span>

    <span style="background-color: lightpink;">shilpa</span>

</body>
</html>
```
