```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced HTML Table</title>
</head>
<body>

    <h1>HTML Advanced Table</h1>

    <table border="1">

        <!-- Table Title -->
        <caption>Student Annual Examination Result</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Main Table Data -->
        <tbody>

            <!-- First Student -->
            <tr>
                <td rowspan="3">101</td>
                <td rowspan="3">Rahul</td>
                <td>HTML</td>
                <td>85</td>
            </tr>

            <tr>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>JavaScript</td>
                <td>88</td>
            </tr>

            <!-- Second Student -->
            <tr>
                <td rowspan="3">102</td>
                <td rowspan="3">Priya</td>
                <td>HTML</td>
                <td>95</td>
            </tr>

            <tr>
                <td>CSS</td>
                <td>92</td>
            </tr>

            <tr>
                <td>JavaScript</td>
                <td>89</td>
            </tr>

        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="3">Total Students</td>
                <td>2</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
